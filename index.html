<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Arial Rounded MT Bold','Arial',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#12000a,#2b0018,#3a0022);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* LOADER */
#loader{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ff4081,#b0004d);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:2000;
    transition:.8s;
}
.loader-hearts i{
    font-size:32px;
    color:white;
    animation:pulse 1.2s infinite;
}
.loader-hearts i:nth-child(2){animation-delay:.2s}
.loader-hearts i:nth-child(3){animation-delay:.4s}
#loader p{color:white;margin-top:20px;font-size:1.3rem}

/* FONDO CORAZONES */
.background-hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}
.heart{
    position:absolute;
    color:rgba(255,64,129,.55);
    animation:float linear infinite;
}
@keyframes float{
    0%{transform:translateY(110vh) scale(.5);opacity:0}
    15%{opacity:1}
    100%{transform:translateY(-120px) scale(1.6);opacity:0}
}

/* CONTENIDO */
.container{z-index:5;text-align:center;color:#fff}
h1{color:#ff80ab;text-shadow:0 0 15px rgba(255,64,129,.8)}

/* SOBRE */
.envelope-wrapper{
    width:320px;height:220px;
    margin:40px auto;
    cursor:pointer;
    position:relative;
}
.envelope{
    position:relative;
    width:100%;
    height:100%;
}
.flap{
    position:absolute;
    top:0;left:0;
    width:100%;height:50%;
    background:linear-gradient(135deg,#ff4081,#e91e63);
    clip-path:polygon(0 0,50% 100%,100% 0);
    transform-origin:top;
    transition:1s;
}
.body{
    position:absolute;
    bottom:0;left:0;
    width:100%;height:70%;
    background:#fff;
    border-radius:0 0 12px 12px;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
}
.seal{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:80px;height:80px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff4081,#e91e63);
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;color:white;
    box-shadow:0 0 25px rgba(255,64,129,.9);
    animation:pulse 2s infinite;
}

/* CARTA */
.letter-container{
    position:absolute;
    top:150px;
    left:50%;
    transform:translateX(-50%);
    width:350px;
    opacity:0;
    transition:1s;
}
.letter{
    background:#fff;
    color:#3a0022;
    border-radius:16px;
    padding:30px;
    box-shadow:0 0 40px rgba(255,64,129,.6),0 25px 60px rgba(0,0,0,.7);
}
.letter h2{color:#e91e63;margin-bottom:15px}
.letter p{line-height:1.8;margin-bottom:15px}
.letter-btn{
    margin-top:15px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#ff4081,#e91e63);
    color:#fff;
    font-size:1.1rem;
    cursor:pointer;
}

/* ESTADOS */
.opened .flap{transform:rotateX(180deg)}
.opened .letter-container{opacity:1}

@keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.15)}
}
/* Quitar resaltado azul en móviles */
* {
    -webkit-tap-highlight-color: transparent;
}

/* Quitar borde / glow de foco */
button,
.envelope-wrapper,
.seal {
    outline: none;
}

/* Quitar focus visual en todos los estados */
button:focus,
button:active,
.envelope-wrapper:focus,
.envelope-wrapper:active,
.seal:focus,
.seal:active {
    outline: none;
    box-shadow: none;
}
button:active,
.envelope-wrapper:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<!-- LOADER INICIAL -->
<div id="loader">
    <div class="loader-hearts">
        <i class="fas fa-heart"></i>
        <i class="fas fa-heart"></i>
        <i class="fas fa-heart"></i>
    </div>
    <p>Preparando tu sorpresa...</p>
</div>

<div class="background-hearts" id="hearts"></div>

<div class="container">
    <h1>Tienes una carta</h1>

    <div class="envelope-wrapper" id="env">
        <div class="envelope">
            <div class="flap"></div>
            <div class="body"></div>
            <div class="seal"><i class="fas fa-heart"></i></div>
        </div>

        <div class="letter-container">
            <div class="letter">
                <h2></h2>
                <p>Hay personas que llegan a tu vida sin hacer ruido…  
                pero lo cambian todo.</p>
                <p>Esta carta es solo una pequeña forma de recordarte  
                lo importante que sos para mí.</p>
                <button class="letter-btn" onclick="go()">Ver sorpresa</button>
            </div>
        </div>
    </div>
</div>

<script>
const hearts=document.getElementById('hearts');
const env=document.getElementById('env');

// loader inicial
window.onload=()=>setTimeout(()=>{
    document.getElementById('loader').style.opacity=0;
    document.getElementById('loader').style.pointerEvents='none';
},2000);

// corazones fondo
setInterval(()=>{
    const h=document.createElement('div');
    h.className='heart';
    h.innerHTML='❤';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=12+Math.random()*40+'px';
    h.style.opacity=Math.random();
    h.style.animationDuration=10+Math.random()*20+'s';
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),30000);
},120);

// abrir carta
env.addEventListener('click',()=>{
    env.classList.add('opened');
});

// redirección con loader de corazones
function go(){
    const loader=document.getElementById('loader');
    loader.style.opacity=1;
    loader.style.pointerEvents='all';
    loader.querySelector('p').innerText='Cargando tu sorpresa...';
    setTimeout(()=>{
        window.location.href='principal.html';
    },2000);
}
</script>

</body>
</html>
